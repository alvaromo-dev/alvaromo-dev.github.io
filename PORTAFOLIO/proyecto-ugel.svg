<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Panel de evaluación con inteligencia artificial">
  <rect width="640" height="400" fill="#17223b"/>
  <!-- Panel principal -->
  <rect x="40" y="50" width="560" height="300" rx="14" fill="#111a2e" stroke="#22304f" stroke-width="2"/>
  <!-- Barras de resultados -->
  <rect x="90" y="250" width="60" height="70" rx="6" fill="#22304f"/>
  <rect x="180" y="200" width="60" height="120" rx="6" fill="#2dd4bf"/>
  <rect x="270" y="170" width="60" height="150" rx="6" fill="#f5a524"/>
  <rect x="360" y="215" width="60" height="105" rx="6" fill="#2dd4bf" opacity="0.7"/>
  <rect x="450" y="150" width="60" height="170" rx="6" fill="#f5a524" opacity="0.85"/>
  <!-- Símbolo matemático y nodo de IA -->
  <text x="90" y="110" font-family="Arial" font-size="36" font-weight="bold" fill="#e6ebf5">∑ ∫ π</text>
  <circle cx="520" cy="95" r="22" fill="none" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="520" cy="95" r="6" fill="#2dd4bf"/>
  <line x1="520" y1="73" x2="520" y2="50" stroke="#2dd4bf" stroke-width="2"/>
  <!-- Etiqueta -->
  <text x="40" y="38" font-family="Arial" font-size="14" fill="#97a3bf">Evaluación de competencias matemáticas</text>
</svg>

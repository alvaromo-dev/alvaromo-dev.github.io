<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustración de minería automatizada">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17223b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#sky)"/>
  <!-- Montañas -->
  <polygon points="0,320 120,200 230,300 340,170 470,310 580,220 640,270 640,480 0,480" fill="#1b2a47"/>
  <polygon points="0,360 150,280 300,350 430,300 640,370 640,480 0,480" fill="#22344f"/>
  <!-- Torre de transporte -->
  <rect x="300" y="200" width="10" height="200" fill="#97a3bf"/>
  <rect x="320" y="200" width="10" height="200" fill="#97a3bf"/>
  <line x1="305" y1="230" x2="325" y2="260" stroke="#97a3bf" stroke-width="3"/>
  <line x1="325" y1="230" x2="305" y2="260" stroke="#97a3bf" stroke-width="3"/>
  <rect x="280" y="190" width="60" height="14" rx="3" fill="#f5a524"/>
  <!-- Cinta transportadora -->
  <rect x="120" y="380" width="400" height="12" rx="6" fill="#2dd4bf"/>
  <rect x="150" y="354" width="34" height="26" rx="4" fill="#f5a524"/>
  <rect x="250" y="354" width="34" height="26" rx="4" fill="#f5a524"/>
  <rect x="350" y="354" width="34" height="26" rx="4" fill="#f5a524"/>
  <circle cx="130" cy="386" r="10" fill="#0b1220" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="510" cy="386" r="10" fill="#0b1220" stroke="#2dd4bf" stroke-width="3"/>
  <!-- Panel de datos -->
  <rect x="60" y="90" width="200" height="120" rx="12" fill="#111a2e" stroke="#22304f" stroke-width="2"/>
  <polyline points="80,180 120,150 160,165 200,120 240,135" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="110" width="80" height="8" rx="4" fill="#97a3bf" opacity="0.6"/>
  <!-- Nodos de conexión -->
  <circle cx="500" cy="120" r="8" fill="#f5a524"/>
  <circle cx="560" cy="170" r="6" fill="#2dd4bf"/>
  <circle cx="470" cy="180" r="5" fill="#2dd4bf"/>
  <line x1="500" y1="120" x2="560" y2="170" stroke="#22304f" stroke-width="2"/>
  <line x1="500" y1="120" x2="470" y2="180" stroke="#22304f" stroke-width="2"/>
</svg>

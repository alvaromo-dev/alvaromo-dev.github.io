<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Flujo de control documentario">
  <rect width="640" height="400" fill="#17223b"/>
  <!-- Documentos en flujo -->
  <rect x="60" y="150" width="90" height="110" rx="8" fill="#111a2e" stroke="#97a3bf" stroke-width="2"/>
  <rect x="75" y="170" width="60" height="6" rx="3" fill="#97a3bf" opacity="0.6"/>
  <rect x="75" y="186" width="50" height="6" rx="3" fill="#97a3bf" opacity="0.6"/>
  <rect x="75" y="202" width="56" height="6" rx="3" fill="#97a3bf" opacity="0.6"/>
  <!-- Flechas -->
  <line x1="160" y1="205" x2="240" y2="205" stroke="#2dd4bf" stroke-width="3"/>
  <polygon points="240,197 254,205 240,213" fill="#2dd4bf"/>
  <line x1="390" y1="205" x2="470" y2="205" stroke="#2dd4bf" stroke-width="3"/>
  <polygon points="470,197 484,205 470,213" fill="#2dd4bf"/>
  <!-- Nodo de control -->
  <rect x="254" y="150" width="136" height="110" rx="12" fill="#111a2e" stroke="#f5a524" stroke-width="2"/>
  <text x="322" y="195" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f5a524">Control</text>
  <text x="322" y="218" text-anchor="middle" font-family="Arial" font-size="13" fill="#97a3bf">Registro · Revisión</text>
  <!-- Documento aprobado -->
  <rect x="484" y="150" width="90" height="110" rx="8" fill="#111a2e" stroke="#2dd4bf" stroke-width="2"/>
  <polyline points="506,206 520,220 552,186" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Barra de trazabilidad -->
  <rect x="60" y="320" width="514" height="8" rx="4" fill="#22304f"/>
  <rect x="60" y="320" width="380" height="8" rx="4" fill="#f5a524"/>
  <text x="60" y="66" font-family="Arial" font-size="18" font-weight="bold" fill="#e6ebf5">Trazabilidad documentaria</text>
</svg>

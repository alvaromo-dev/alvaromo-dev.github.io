<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Portada: operación minera">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17223b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#cielo)"/>
  <!-- Montañas en capas -->
  <polygon points="0,330 180,210 360,310 560,170 780,300 1000,190 1220,300 1420,200 1600,280 1600,500 0,500" fill="#1b2a47"/>
  <polygon points="0,400 220,320 430,380 680,300 940,390 1180,320 1440,390 1600,350 1600,500 0,500" fill="#22344f"/>
  <!-- Cuadrícula sutil de diseño técnico -->
  <g stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="100" x2="1600" y2="100"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
    <line x1="1200" y1="0" x2="1200" y2="500"/>
    <line x1="1400" y1="0" x2="1400" y2="500"/>
  </g>
  <!-- Torres de transporte -->
  <g stroke="#97a3bf" stroke-width="6" fill="none" opacity="0.8">
    <line x1="1100" y1="240" x2="1100" y2="420"/>
    <line x1="1160" y1="240" x2="1160" y2="420"/>
    <line x1="1100" y1="260" x2="1160" y2="260"/>
    <line x1="1100" y1="300" x2="1160" y2="300"/>
  </g>
  <rect x="1080" y="228" width="100" height="14" rx="3" fill="#f5a524"/>
  <!-- Cinta transportadora -->
  <rect x="200" y="420" width="1100" height="12" rx="6" fill="#2dd4bf" opacity="0.7"/>
  <!-- Línea de datos -->
  <polyline points="180,140 300,110 420,130 540,80 660,100" fill="none" stroke="#f5a524" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="660" cy="100" r="7" fill="#f5a524"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo AM">
  <!-- Hexágono exterior: referencia a la industria minera y de ingeniería -->
  <polygon points="32,3 58,17.5 58,46.5 32,61 6,46.5 6,17.5" fill="#111a2e" stroke="#f5a524" stroke-width="3" stroke-linejoin="round"/>
  <!-- Iniciales -->
  <text x="32" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6ebf5">AM</text>
  <!-- Línea de circuito / automatización -->
  <line x1="14" y1="50" x2="50" y2="50" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="2.5" fill="#2dd4bf"/>
</svg>
